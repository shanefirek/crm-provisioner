[build]
builder = "NIXPACKS"

[deploy]
# Run migrations idempotently before starting the server. All migrations use
# `if not exists` semantics so re-running is safe across restarts/rollouts.
startCommand = "bash scripts/migrate.sh && node --experimental-strip-types src/host/server.ts"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
